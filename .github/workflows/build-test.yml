name: build-test

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # C++ is home base.  Debug on purpose: every test in this project is an
  # assert, and a Release build defines NDEBUG and compiles them all away.
  cpp:
    name: C++ ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  # The C port, across all three thread-local storage backends.  It is
  # warning-free by construction, so -Werror is what keeps it that way.
  c:
    name: C ${{ matrix.os }} ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        backend: ['', '-DRETAIN_TLS_KEYS', '-DRETAIN_SINGLE_THREADED']
        include:
          - backend: ''
            name: thread_local
          - backend: '-DRETAIN_TLS_KEYS'
            name: tls-keys
          - backend: '-DRETAIN_SINGLE_THREADED'
            name: single-threaded
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: >
          make -C ports/c test
          BACKEND="${{ matrix.backend }}"
          CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O2"

  # The job that matters most for portability: this one actually EXECUTES the
  # _WIN32 paths -- TlsAlloc, InitOnceExecuteOnce, CreateThread, Sleep -- on a
  # real Windows host, rather than only compiling them.  MSVC is not covered:
  # RETAIN is built on __attribute__((cleanup)), which MSVC does not have, and
  # retain.h says so at the use site.
  c-windows:
    name: C windows-mingw ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        backend: ['', '-DRETAIN_TLS_KEYS', '-DRETAIN_SINGLE_THREADED']
        include:
          - backend: ''
            name: thread_local
          - backend: '-DRETAIN_TLS_KEYS'
            name: tls-keys
          - backend: '-DRETAIN_SINGLE_THREADED'
            name: single-threaded
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-gcc
      - uses: actions/checkout@v4
      - name: Build and test
        run: >
          make -C ports/c test
          BACKEND="${{ matrix.backend }}"
          CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O2"

  java:
    name: Java ${{ matrix.java }} ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash        # so the *.java glob expands on Windows too
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # -nowarn is for Static.java, the 2014 port, which still uses
      # new Integer(...) and raw types.  Both are warnings, not errors.
      - name: Both ports
        run: |
          javac -nowarn -d classes ports/java/retained/*.java
          java -cp classes retained.RetainTest | tail -1
          java -cp classes retained.Test > /dev/null

  python:
    name: Python ${{ matrix.python }} ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Threads and asyncio isolation
        run: python ports/python/retain_test.py

  rust:
    name: Rust ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The release profile keeps debug-assertions on, because the asserts
      # are the test.  cargo test covers the doc examples.
      - name: Doc examples
        run: cargo test --release --manifest-path ports/rust/Cargo.toml
      - name: Stress test
        run: cargo run --release --manifest-path ports/rust/Cargo.toml --bin retain_test

  # The cross-language invariant: every port runs src/test.cpp structurally
  # and must print the same 110 lines as the C++ original, byte for byte.
  # Randomized sleeps vary the interleaving, so agreement across five
  # languages is what demonstrates the stacks are thread-confined.
  transcript:
    name: All ports print the same transcript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the C++ reference
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
      - name: Compare every port against it
        run: |
          only_transcript() { sed '1d;/^ok: /d;/^$/d'; }

          ./build/test_retain | only_transcript > cpp.txt
          echo "C++ reference: $(wc -l < cpp.txt) lines"
          test "$(wc -l < cpp.txt)" -eq 110

          make -C ports/c transcript > c.txt
          python3 ports/python/retain_test.py | only_transcript > python.txt
          cargo run --release --quiet --manifest-path ports/rust/Cargo.toml \
            --bin retain_test | only_transcript > rust.txt
          javac -nowarn -d classes ports/java/retained/*.java
          java -cp classes retained.RetainTest | only_transcript > java.txt

          for port in c python rust java; do
            diff cpp.txt "$port.txt" && echo "$port matches the C++ transcript"
          done

  # A library whose entire premise is per-thread state earns a race detector.
  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest
    env:
      # TSan prints races but exits 0 by default, which would let one pass CI.
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: ThreadSanitizer
        run: |
          g++ -std=c++17 -g -fsanitize=thread -Iinclude -o tsan_cpp src/test.cpp -lpthread
          ./tsan_cpp > /dev/null
          gcc -std=c11 -g -fsanitize=thread -Iports/c -o tsan_c \
            ports/c/retain_test.c ports/c/thread.c -lpthread
          ./tsan_c > /dev/null
      - name: Address and UndefinedBehavior sanitizers
        run: |
          for san in address undefined; do
            echo "--- $san ---"
            g++ -std=c++17 -g -fsanitize=$san -fno-sanitize-recover=all \
              -Iinclude -o s_cpp src/test.cpp -lpthread
            ./s_cpp > /dev/null
            gcc -std=c11 -g -fsanitize=$san -fno-sanitize-recover=all \
              -Iports/c -o s_c ports/c/retain_test.c ports/c/thread.c -lpthread
            ./s_c > /dev/null
            gcc -std=c11 -g -fsanitize=$san -fno-sanitize-recover=all \
              -Iports/c -Iinclude -o s_csort ports/c/csort.c src/sort.c
            ./s_csort > /dev/null
          done
